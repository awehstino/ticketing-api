# fly.toml app configuration file generated for ticketing-api-kuro on 2026-03-03T16:55:38Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'ticketing-api-kuro'
primary_region = 'lhr'

[build]
  [build.args]
    GO_VERSION = '1.24.2'

[env]
  PORT = '8080'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024
